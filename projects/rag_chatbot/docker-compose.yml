# Docker Compose for RAG Chatbot

services:
  rag-api:
    build:
      context: ..
      dockerfile: projects/rag_chatbot/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./knowledge:/app/rag_chatbot/knowledge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn projects.rag_chatbot.api:app --host 0.0.0.0 --port 8000

  rag-streamlit:
    build:
      context: ..
      dockerfile: projects/rag_chatbot/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./knowledge:/app/rag_chatbot/knowledge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: streamlit run projects/rag_chatbot/app.py --server.port=8501 --server.address=0.0.0.0
